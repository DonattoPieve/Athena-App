name: release

# Cria a versão nova quando você empurra uma tag `v1.2.3`.
#
# Por que tag e não todo push: build de instalador leva minutos e gera um
# arquivo de 80 MB. Amarrar isso a cada commit encheria o Releases de lixo e
# faria o app instalado se atualizar para código pela metade. A tag é o gesto
# explícito de "esta é uma versão".
#
# A tag tem que combinar com o `version` do package.json — é esse número que o
# `latest.yml` publica e que o app instalado compara. Se estiverem diferentes, o
# passo de conferência abaixo quebra o build antes de publicar nada.
#
# Para lançar:  npm run lancar
# (confere, sobe a versão nos dois arquivos, cria a tag anotada e empurra.)

on:
  push:
    # `main` não builda instalador — só tira os prints (job `telas`), que é
    # como uma regressão de interface aparece antes de virar Release.
    branches: [main]
    tags: ["v*"]
  # Deixa disparar à mão pelo site do GitHub, para quando a tag já existe.
  workflow_dispatch:

jobs:
  windows:
    # SÓ em tag. Sem esta linha, um push na main chegaria ao `dist:publish`,
    # que publica com `--publish always` — Release sem versão, do nada.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      # O electron-builder usa o GITHUB_TOKEN para criar o Release e subir o .exe.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Node 22, e nao 20: o `jsdom` pede `^22.22.2 || ^24.15.0 || >=26` e o
      # `undici` que vem com ele pede `>=22.19`. O `npm ci` so avisa sobre
      # engines, entao no Node 20 a instalacao passava e o `test:md` quebrava
      # depois, dentro do jsdom, com "webidl.util.markAsUncloneable is not a
      # function" — um erro que nao diz em lugar nenhum que o problema e a
      # versao do Node. A maquina do Donatto ja roda 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: A tag combina com o package.json?
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME nao combina com a versao $pkg do package.json."
            echo "Use 'npm version <patch|minor|major>', que muda os dois de uma vez."
            exit 1
          fi

      - run: npm ci

      # `npm test`, e nao a lista escrita a mao que estava aqui: ela tinha
      # ficado para tras justamente nos dois testes que guardam o material do
      # professor (`test:importar` e `test:espelho`), entao um instalador podia
      # ser publicado com essa regra quebrada. Assim, teste novo entra no CI
      # sozinho. Todos rodam offline — inclusive o do Worker, que sobe um
      # bucket e um Supabase de mentira (ver worker/teste.mjs).
      - name: Typecheck e testes
        run: |
          npm run typecheck
          npm test

      - name: Instalador e publicação
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # O portão do R2, publicado junto da versão.
  #
  # O 405 de 25/08 existiu por isto: a rota DELETE estava no disco havia dias
  # e o `wrangler deploy` não tinha rodado, então o app instalado pedia para
  # apagar numa porta que não existia. Amarrando o deploy à tag, o Worker
  # publicado é sempre o do código que gerou o instalador.
  #
  # O token é de API da Cloudflare (Workers Scripts: Edit) e NÃO é a chave do
  # R2 — o bucket continua entrando por binding, sem credencial nenhuma (ver
  # worker/wrangler.jsonc). Enquanto o segredo não existir, o passo é pulado
  # em vez de derrubar o release.
  # ------------------------------------------------------------------
  worker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Sem CLOUDFLARE_API_TOKEN nos Secrets — deploy do Worker pulado."
            echo "Crie o token na Cloudflare (Workers Scripts: Edit) e adicione em"
            echo "Settings > Secrets and variables > Actions."
            exit 0
          fi
          npx --yes wrangler deploy --config worker/wrangler.jsonc

  # ------------------------------------------------------------------
  # Prints das telas.
  #
  # Roda a cada push na main, com a ponte falsa do `telas.mjs` (nada de conta,
  # nada de disco). É o único jeito de uma regressão de interface aparecer sem
  # alguém abrir o app — e quem trabalha por uma ponte que só enxerga arquivos
  # não abre o app nunca.
  #
  # Não bloqueia release nenhum: se quebrar, quebra sozinho, e as imagens
  # ficam no artefato "telas" da execução.
  # ------------------------------------------------------------------
  telas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Só o renderer: o `build` completo também compila o main do Electron,
      # que não tem nada a ver com print de tela.
      - run: npx vite build
      - name: Tirar os prints
        env:
          ATHENA_TELAS_DIR: telas
        run: |
          mkdir -p telas
          npm run telas
          npm run telas -- --en
      - uses: actions/upload-artifact@v4
        with:
          name: telas
          path: telas/
