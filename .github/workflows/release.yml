name: release

# Cria a versão nova quando você empurra uma tag `v1.2.3`.
#
# Por que tag e não todo push: build de instalador leva minutos e gera um
# arquivo de 80 MB. Amarrar isso a cada commit encheria o Releases de lixo e
# faria o app instalado se atualizar para código pela metade. A tag é o gesto
# explícito de "esta é uma versão".
#
# A tag tem que combinar com o `version` do package.json — é esse número que o
# `latest.yml` publica e que o app instalado compara. Se estiverem diferentes, o
# passo de conferência abaixo quebra o build antes de publicar nada.
#
# Para lançar:
#   npm version patch      # sobe o package.json e cria a tag
#   git push --follow-tags

on:
  push:
    tags: ["v*"]
  # Deixa disparar à mão pelo site do GitHub, para quando a tag já existe.
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # O electron-builder usa o GITHUB_TOKEN para criar o Release e subir o .exe.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Node 22, e nao 20: o `jsdom` pede `^22.22.2 || ^24.15.0 || >=26` e o
      # `undici` que vem com ele pede `>=22.19`. O `npm ci` so avisa sobre
      # engines, entao no Node 20 a instalacao passava e o `test:md` quebrava
      # depois, dentro do jsdom, com "webidl.util.markAsUncloneable is not a
      # function" — um erro que nao diz em lugar nenhum que o problema e a
      # versao do Node. A maquina do Donatto ja roda 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: A tag combina com o package.json?
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME nao combina com a versao $pkg do package.json."
            echo "Use 'npm version <patch|minor|major>', que muda os dois de uma vez."
            exit 1
          fi

      - run: npm ci

      # `npm test`, e nao a lista escrita a mao que estava aqui: ela tinha
      # ficado para tras justamente nos dois testes que guardam o material do
      # professor (`test:importar` e `test:espelho`), entao um instalador podia
      # ser publicado com essa regra quebrada. Assim, teste novo entra no CI
      # sozinho. Todos rodam offline — inclusive o do Worker, que sobe um
      # bucket e um Supabase de mentira (ver worker/teste.mjs).
      - name: Typecheck e testes
        run: |
          npm run typecheck
          npm test

      - name: Instalador e publicação
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
